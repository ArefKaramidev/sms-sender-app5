name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android project
        shell: bash
        run: |
          if [ -d "SmsSenderApp/app" ]; then
            echo "PROJECT_DIR=SmsSenderApp" >> "$GITHUB_ENV"
          elif [ -d "app" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Android project not found!"
            exit 1
          fi

      - name: Create settings.gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle" ]; then
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmsSenderApp"
          include ':app'
          EOF
          fi

      - name: Create gradle.properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradle.properties" ]; then
            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsSenderApp-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
